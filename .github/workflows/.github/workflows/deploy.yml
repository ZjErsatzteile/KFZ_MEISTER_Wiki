name: Deploy KFZ_MEISTER_Wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages veröffentlichen
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Statische Website als Pages-Artefakt bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
